# Position Control Configuration for OpenARM with MuJoCo
#
# Copyright 2025 Zordi, Inc. All rights reserved.
#
# This configuration uses the JointTrajectoryController for position control.
# Suitable for trajectory following and motion planning integration (e.g., MoveIt2).

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz - Match MuJoCo's 1ms timestep for minimal latency

    # Controllers to be loaded
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters: {}

joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_joint1
      - openarm_joint2
      - openarm_joint3
      - openarm_joint4
      - openarm_joint5
      - openarm_joint6
      - openarm_joint7

    # Command interfaces (what we send to hardware)
    command_interfaces:
      - position

    # State interfaces (what we read from hardware)
    state_interfaces:
      - position
      - velocity

    # Allow partial goal trajectories
    allow_partial_joints_goal: false

    # Open loop control (no feedback for trajectory interpolation)
    # Set to true for pure feedforward control
    open_loop_control: false

    # Allow integration in goal trajectories
    # Useful for velocity-based trajectory generation
    allow_integration_in_goal_trajectories: true

    # Tolerances for goal achievement
    constraints:
      stopped_velocity_tolerance: 0.01  # rad/s
      goal_time: 0.0  # seconds, 0 = no time constraint

    # Per-joint goal tolerances
    openarm_joint1:
      trajectory: 0.05  # rad - tolerance during trajectory
      goal: 0.01  # rad - tolerance at goal
    openarm_joint2:
      trajectory: 0.05
      goal: 0.01
    openarm_joint3:
      trajectory: 0.05
      goal: 0.01
    openarm_joint4:
      trajectory: 0.05
      goal: 0.01
    openarm_joint5:
      trajectory: 0.05
      goal: 0.01
    openarm_joint6:
      trajectory: 0.05
      goal: 0.01
    openarm_joint7:
      trajectory: 0.05
      goal: 0.01

