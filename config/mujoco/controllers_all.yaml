# Dynamic Mode Switching Configuration for OpenARM with MuJoCo
#
# Copyright 2025 Zordi, Inc. All rights reserved.
#
# This configuration supports dynamic mode switching:
# - position_servo: Trajectory controller (pos+vel) → MuJoCo actuators
# - mit: All other controllers → Full MIT mode PID
#
# Mode switches automatically when you switch controllers!

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz - Match MuJoCo's 1ms timestep

    # Controllers to be loaded
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    effort_controller:
      type: effort_controllers/JointGroupEffortController

    zordi_joint_mit_controller:
      type: zordi_mit_controller/ZordiJointController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100  # Hz - Reduced from 1000 to reduce spam

# Joint Trajectory Controller
# Uses position + velocity interfaces
# Triggers position_servo mode (MuJoCo actuators)
joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_joint1
      - openarm_joint2
      - openarm_joint3
      - openarm_joint4
      - openarm_joint5
      - openarm_joint6
      - openarm_joint7

    # Command interfaces: position + velocity (no effort)
    # This combination triggers position_servo mode
    command_interfaces:
      - position
      - velocity

    # State interfaces: read current position and velocity
    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    # Tolerances
    # With velocity damping fix, oscillations should be eliminated
    constraints:
      stopped_velocity_tolerance: 0.05  # rad/s
      goal_time: 0.5  # Allow 0.5s settling time after trajectory

    # Per-joint position tolerances (rad)
    openarm_joint1: {trajectory: 0.05, goal: 0.01}
    openarm_joint2: {trajectory: 0.05, goal: 0.01}
    openarm_joint3: {trajectory: 0.05, goal: 0.01}
    openarm_joint4: {trajectory: 0.05, goal: 0.01}
    openarm_joint5: {trajectory: 0.05, goal: 0.01}
    openarm_joint6: {trajectory: 0.05, goal: 0.01}
    openarm_joint7: {trajectory: 0.05, goal: 0.01}

# Effort Controller
# Uses effort interface only
# Triggers mit mode (with Kp=0, Kd=0 naturally)
effort_controller:
  ros__parameters:
    joints:
      - openarm_joint1
      - openarm_joint2
      - openarm_joint3
      - openarm_joint4
      - openarm_joint5
      - openarm_joint6
      - openarm_joint7

    interface_name: effort

# Zordi Joint MIT Controller
# Generic trajectory controller with configurable interfaces
# Hardware plugin applies PID gains (from URDF) + effort feedforward
zordi_joint_mit_controller:
  ros__parameters:
    joints:
      - openarm_joint1
      - openarm_joint2
      - openarm_joint3
      - openarm_joint4
      - openarm_joint5
      - openarm_joint6
      - openarm_joint7

    # Configurable interfaces (like JointTrajectoryController)
    command_interfaces:
      - position  # Hardware: Adds Kp*(pos_cmd - pos)
      - velocity  # Hardware: Adds Kd*(vel_cmd - vel)
      - effort    # Hardware: Adds effort_cmd directly

    state_interfaces:
      - position
      - velocity

    use_gravity_compensation: true  # Computes gravity feedforward

    # Note: PID gains (Kp, Kd) are in URDF (hardware-specific)
    # This controller sends desired pos/vel/effort
    # Hardware plugin (mujoco_system.cpp or real) applies:
    #   τ = Kp*(pos_cmd - pos) + Kd*(vel_cmd - vel) + effort_cmd

# Note: CartesianController from crisp_controllers also provides full MIT mode
# with Cartesian space control and full dynamics computation.

# Usage:
# 1. Launch once - mode switches automatically
#    ros2 launch openarm_description single_arm.launch.py
#
# 2. Basic trajectory tracking (position_servo mode - actuators):
#    ros2 control switch_controllers --activate joint_trajectory_controller
#
# 3. Pure gravity compensation (mit mode, effort only):
#    ros2 control switch_controllers \
#      --deactivate joint_trajectory_controller \
#      --activate effort_controller
#    # Triggers: MIT mode (Kp=0, Kd=0, only effort term active)
#
# 4. Full MIT mode (position + velocity + effort):
#    ros2 control switch_controllers --activate zordi_joint_mit_controller
#    # Claims all three interfaces, triggers MIT mode
#    # Send trajectories to: /zordi_joint_mit_controller/follow_joint_trajectory
